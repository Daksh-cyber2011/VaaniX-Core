name: vaanix_app
description: >
  VaaniX — A Sanskrit-first AI-powered language learning companion for Indian students.
  Built around Van, an emotionally intelligent AI duck companion.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Supabase (auth + database)
  supabase_flutter: ^2.5.3

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Networking
  dio: ^5.4.3

  # Google Fonts
  google_fonts: ^6.2.1

  # Animation (Lottie files for Van animations)
  lottie: ^3.1.0

  # Image caching
  cached_network_image: ^3.3.1

  # Functional programming (Either / Result types)
  dartz: ^0.10.1

  # Value equality
  equatable: ^2.0.5

  # Freezed data classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local storage (preferences)
  shared_preferences: ^2.3.1

  # Icons
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets — placeholders for Van assets, fonts, and env
  assets:
    - assets/env/.env
    - assets/images/
    - assets/animations/
    - assets/icons/

  # Fonts (Google Fonts handles downloads, but listing for reference)
  # Nunito is loaded at runtime via google_fonts package
