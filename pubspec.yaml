name: vaanix_app
description: >
  VaaniX — A Sanskrit-first AI-powered language learning companion for Indian students.
  Built around Van, an emotionally intelligent AI duck companion.
version: 1.0.0+1

environment:
  # Color.withValues() requires Dart 3.6+; the Material 3 theme APIs
  # (CardThemeData / DialogThemeData) require a matching recent Flutter.
  # See README → Prerequisites for the verified toolchain.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Supabase (auth + database)
  supabase_flutter: ^2.5.3

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Networking
  dio: ^5.4.3

  # Network connectivity awareness (offline detection)
  connectivity_plus: ^6.0.3

  # Animation (Lottie files for Van animations)
  lottie: ^3.1.0

  # Image caching
  cached_network_image: ^3.3.1

  # Functional programming (Either / Result types)
  dartz: ^0.10.1

  # Value equality
  equatable: ^2.0.5

  # Local storage (preferences)
  shared_preferences: ^2.3.1

  # Icons
  flutter_svg: ^2.0.10+1

  # Crash reporting (production error visibility)
  sentry_flutter: ^9.0.0

  # AI — Google Gemini SDK (first real online ModelAdapter)
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  # Fonts — Poppins bundled for offline-first typography.
  # OFL license: assets/fonts/OFL.txt. Weights map to the scales used by
  # AppTextStyles (w400 body → w800 display).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

  # Assets — Van assets, icons, images, environment
  #
  # NOTE: assets/env/ MUST be declared so the bundled .env file ships inside
  # the APK/IPA. Without this, dotenv.load() silently fails at startup and
  # Supabase never initializes even when credentials are present.
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/env/
    - assets/curriculum/
    - assets/van/metadata/
